spring.application.name=sistema-logistica-api-test

# Base de datos en memoria (H2) para testing aislado
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Deshabilitamos Flyway en entorno de test para que H2 funcione directo con Hibernate
spring.flyway.enabled=false


# Deshabilitar correo en tests para que no intente conectarse a SMTP
spring.mail.host=localhost
spring.mail.port=1025
